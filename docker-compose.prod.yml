services:
  flower-forecast:
    build: .
    container_name: flower-forecast
    env_file:
      - path: .env
        required: true
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./data:/app/data
      - /opt/backups/prognoz_zakupok:/app/backups
    environment:
      ADMIN_BACKUP_DIR: /app/backups
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 1024m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
